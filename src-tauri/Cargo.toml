[package]
name = "agentdesk"
version = "0.1.0"
description = "Desktop mission control for AI coding agents"
authors = ["Aman Bansal"]
edition = "2021"

[lib]
name = "agentdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
